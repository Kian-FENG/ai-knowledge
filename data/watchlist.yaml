discovery:
  enabled: true
  rules: >-
    每日主动发现；优先官网、创始人原文、论文/仓库和可靠报道。核实后新增实体，不限已有名单。
    融资传闻保留归因。下列检索由 Agent 用自己的搜索工具按报告窗口执行（限定时间范围），
    结果只是线索，须打开原发媒体或一手来源并 import 后才能引用。news.google.com 的
    robots.txt 禁止自动抓取 /rss，所以这些查询不进入 collect。
  queries:
  - new AI startup launch funding foundation model agent infrastructure
  - 中国 AI 新公司 成立 融资 模型 智能体 推理
  searches:
  - id: reuters-ai-exclusives
    query: 'site:reuters.com (exclusive OR sources OR "familiar with") (OpenAI OR Anthropic OR Nvidia OR DeepSeek OR ByteDance OR Alibaba OR Tencent OR Huawei OR Cambricon OR HBM OR "AI chip" OR "AI model")'
    note: 2026-09-06 至 09-13 回测命中样例 #10 #31 #32 #48 全部 4 条路透报道；techmeme-river 只收录其中被 Techmeme 选中的部分
  - id: bloomberg-ai
    query: 'site:bloomberg.com (OpenAI OR Anthropic OR Nvidia OR ByteDance OR Alibaba OR Tencent OR DeepSeek OR "AI chip" OR "AI model")'
    note: 回测命中 #29 #40；#2 #25 未检出，需按公司名补查
  - id: ft-nyt-wsj-ai
    query: '(site:ft.com OR site:nytimes.com OR site:wsj.com) (OpenAI OR Anthropic OR Nvidia OR DeepSeek OR "AI chip" OR "AI model")'
  - id: china-ai-companies-zh
    query: '(大模型 OR 人工智能 OR 智能体 OR 算力 OR AI芯片) (腾讯 OR 阿里 OR 字节 OR 百度 OR DeepSeek OR 月之暗面 OR 智谱 OR MiniMax OR 华为 OR 寒武纪 OR 京东 OR 蚂蚁 OR 小米)'
    note: 公众号首发的产品、人事、招聘新闻（样例 #1 #5 #16 #21 #23 #24 #39）多经此类转载被发现
  - id: china-ai-policy-zh
    query: '(工信部 OR 国家数据局 OR 网信办 OR 最高法 OR 证监会 OR 发改委 OR 外交部) (人工智能 OR 算力 OR 大模型 OR 词元 OR 智能体 OR 芯片)'
  - id: china-chips-zh
    query: '(HBM OR 存储芯片 OR AI芯片 OR GPU OR 光刻机 OR 算力集群) (涨价 OR 出口管制 OR 产能 OR 订单 OR 发布 OR 融资)'
  - id: embodied-world-models-zh
    query: '(具身智能 OR 人形机器人 OR 世界模型) (发布 OR 融资 OR 开源 OR 上市 OR IPO)'
    note: 样例 #22 #34 #39
  - id: supply-chain-en
    query: '(HBM OR "High-NA" OR CoWoS OR "export controls" OR "memory prices" OR "chip prices") (AI OR chip OR chips OR memory)'
  - id: newsroom-fallback
    query: 'site:qualcomm.com/news OR site:asml.com/en/news OR site:pr.tsmc.com OR site:x.ai/news OR site:qwen.ai OR site:minimax.io'
    note: 官网拦截采集器或需 JS 时的发现兜底；逐个 site 查询更可靠。回测可找到 9/8 高通—亚马逊与 ASML—TSMC 公告
