# 机器采集源。字段与采集行为见 docs/ingest-automation.md；端点核验记录见
# docs/source-remediation-2026-10-02.md。checked_at 为端点最近一次实测日期（北京时间）。
#
# kind:   feed=RSS/Atom；web=网页（有 link_pattern 时发现新链接，否则检测正文变化）；
#         sitemap=站点地图新 URL；hf-models=Hugging Face 模型列表新仓库。
# group:  official/infra/research/government/media/aggregator；aggregator 结果只是线索，不能作证据。
# fetch:  browser 表示 JS 渲染或拒绝本采集器，collect 不抓取，由 Agent 用浏览器核查。
# poll_hours: `collect --due` 的最短间隔，按 feed 实测保留时长设置（约为保留时长一半以内）。
# include: 关键词过滤（标题与摘要）；ASCII 词按单词边界匹配。

keywords:
  ai_en: &ai_en [AI, A.I., artificial intelligence, OpenAI, Anthropic, Claude, Gemini, DeepMind, Nvidia, GPU, GPUs, TPU, HBM, chip, chips, chipmaker, semiconductor, semiconductors, data center, data centers, datacenter, LLM, model, models, agent, agents, robotics, humanoid, xAI, Grok, Mistral, DeepSeek, Qwen, Alibaba, Tencent, ByteDance, Huawei, TSMC, ASML, SK Hynix, Micron, export control, export controls, compute, inference, Copilot, superintelligence, AGI]
  ai_zh: &ai_zh [AI, AIGC, 人工智能, 大模型, 智能体, Agent, 算力, 智算, 芯片, GPU, HBM, 半导体, 光刻, 具身, 人形机器人, 世界模型, OpenAI, Anthropic, Claude, DeepSeek, 千问, 通义, Qwen, Kimi, 月之暗面, 智谱, MiniMax, 豆包, 混元, 文心, 英伟达, 寒武纪, 昇腾, 词元, Token, 数据中心, 多模态, 开源模型, 阿里云, 腾讯云, 华为云, 火山引擎, 百度智能云, 出口管制, 实体清单, 断供, 制裁, 禁运]

